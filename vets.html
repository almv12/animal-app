    <nav class="nav" id="nav">

    <button class="hamburger" id="hamburger" aria-label="Меню"><span></span><span></span><span></span></button>

</header>
  <section class="page-hero">

<footer class="footer">

<script src="/script.js?v=2"></script>

<script src="/api.js"></script>
<script>
function renderVetCard(v) {
  const badge24h = v.is_24h ? '<span style="background:#FF8C42;color:#fff;font-size:.7rem;padding:2px 8px;border-radius:20px;font-weight:800;margin-left:4px">24/7</span>' : '';
  const addr = v.address || v.city || '';
  const phones = Array.isArray(v.phone) && v.phone.length
    ? v.phone.map(p => '<a href="tel:' + p.replace(/\s/g,'') + '" style="color:var(--primary)">' + p + '</a>').join(', ')
    : '';
  const services = Array.isArray(v.services) && v.services.length
    ? '<div style="display:flex;flex-wrap:wrap;gap:4px;margin:6px 0">' + v.services.slice(0,5).map(s=>'<span style="font-size:.72rem;background:#f0faf5;color:#4CAF82;border:1px solid #c8eedd;padding:2px 8px;border-radius:12px;font-weight:600">' + s + '</span>').join('') + '</div>'
    : '';
  const sm = v.social_media || {};
  const socials = [sm.telegram&&'<a href="'+sm.telegram+'" target="_blank">✈️ Telegram</a>',sm.instagram&&'<a href="'+sm.instagram+'" target="_blank">📸 Instagram</a>',sm.facebook&&'<a href="'+sm.facebook+'" target="_blank">🌐 Facebook</a>',v.website&&'<a href="'+v.website+'" target="_blank">🔗 Сайт</a>'].filter(Boolean).join('');
  return '<div class="shelter-card"><div class="shelter-card__logo">🏥</div><h3 class="shelter-card__name">' + v.name + badge24h + '</h3><div class="shelter-card__meta">' + (addr?'<span>📍 '+addr+'</span>':'') + (v.district?'<span>🏙 '+v.district+'</span>':'') + (v.rating?'<span>⭐ '+v.rating+'</span>':'') + '</div><p style="font-size:.9rem;color:var(--muted);margin:8px 0;line-height:1.6">' + (v.description||'') + '</p>' + services + (phones?'<p style="margin:6px 0;font-size:.9rem">📞 '+phones+'</p>':'') + (socials?'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:.85rem">'+socials+'</div>':'') + '</div>';
}

sbFetch('vets', 'status=eq.active&order=name')
  .then(function(data) {
    document.getElementById('loading')?.remove();
    if (!data || !data.length) { document.getElementById('grid').innerHTML = '<p style="text-align:center;color:var(--muted);padding:40px">Ничего не найдено</p>'; return; }
    document.getElementById('grid').innerHTML = data.map(renderVetCard).join('');
    if (typeof initFadeIn === 'function') initFadeIn();
  })
  .catch(function(e) { console.warn('vets fetch failed', e); });
</script>
</body>
</html>
